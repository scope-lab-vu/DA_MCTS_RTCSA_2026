# Algorithm Configuration: MCTS DPW C++ controller + known F1TENTH dynamics
# Same as mcts_dpw_py but uses the C++ accelerated tree search.

controller:
  type: mcts_dpw_cpp
  # --- MCTS DPW hyperparameters ---
  n_simulations: 1000
  exploration_constant: 1.0    # K (UCB exploration)
  alpha_dpw: 0.5               # action progressive widening exponent
  beta_dpw: 0.5                # outcome progressive widening exponent
  discount: 0.9             # rollout discount factor
  rollout_horizon: 10          # matches MPPI horizon; no early termination now
  # --- Reward/cost tuning (shared with MPPI) ---
  v_ref: 1000.0
  # We might need to reduce this values as the controller crashes for high friction. 
  # It could be giving more importance to speed than safety.
  speed_weight: 1.0
  alpha_threshold: 1.6
  use_occupancy_map: true
  lane_width: 1.1

dynamics:
  type: f1tenth_dynamics   # Known dynamics (same math as gym) — for testing

safety:
  type: noop

simulation:
  vehicle_interface: gym
  dt_s: 0.04             # Timestep in seconds (controls loop rate: 1/dt_s Hz)
  log_every_n_steps: 1
  seed: 42               # Random seed for reproducibility
