# Algorithm Configuration: MPPI controller + PI-SVGP dynamics model
# Uses a multi-output GP to predict Pacejka tire parameters,
# then applies Pacejka physics for next-state prediction.

controller:
  type: mppi
  # --- MPPI-specific ---
  horizon: 15
  num_samples: 5000
  lambda_: 2.93
  noise_sigma_accel: 2.29
  noise_sigma_steer: 3.98
  v_ref: 5.0
  device: cpu
  use_occupancy_map: true
  lane_width: 1.1
  # --- Cost function tuning ---
  v_max_cost: 11.0
  alpha_threshold: 0.7
  speed_weight: 5.0

dynamics:
  type: pi_svgp
  model_path: models/pi_svgp/pi_svgp_best_params.npz
  task_index: 0               # 0: mu=1.0489, 1: mu=0.8642, 2: mu=0.4947
  inference_device: cpu

safety:
  type: noop

simulation:
  vehicle_interface: gym
  dt_s: 0.04
  log_every_n_steps: 200
  seed: 42
