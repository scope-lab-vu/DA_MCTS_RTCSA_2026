controller:
  type: da_mcts_new_reward_ts_100ms

  # MCTS tree hyperparameters
  alpha_dpw: 0.5
  beta_dpw: 0.1
  exploration_constant: 1.0
  discount: 0.9
  n_simulations: 0             # 0 → use mcts_time_budget instead

  # Time budget — wall-clock per decision (NOT the control period).
  # At dt_s=0.1 we have 100 ms between control commands; 90 ms gives MCTS
  # ~3× the search budget of the dt=40 ms parent (which used 30 ms) while
  # leaving 10 ms of slack for rendering / housekeeping.
  mcts_time_budget: 0.090
  dynamic_budget: False
  dynamic_budget_min: 0.005
  dynamic_budget_max: 0.030

  localize_budget: false
  localize_budget_overhead_s: 0.010

  budget_n_warmup: 10
  budget_n_recalibrate: 10

  # Rollout horizons — these are tick counts at the controller's dt (now 100 ms).
  # The defaults below are inherited from the dt=40 ms parent config; equivalent
  # *physical* horizon there was 12·0.04 = 0.48 s. To match that physical horizon
  # at dt=100 ms drop the value to ~5. Leaving as-is (1.2 s of physical preview)
  # — adjust if rollouts are too long / too short.
  # rollout_horizon: 12
  # rollout_horizon_straight: 15
  # rollout_horizon_curve: 15
  rollout_horizon: 5
  rollout_horizon_straight: 5
  rollout_horizon_curve: 5
  kappa_threshold: 0.05

  # Cost / reward
  speed_weight: 1.0
  v_ref: 1000.0
  # alpha_threshold: 0.475
  alpha_threshold: 1.5

  normalize_reward: false

  # Track boundaries
  lane_width: 1.1
  real_track_width: 1.2

  # Lateral acceleration budget for v_ref window solver
  a_lat_budget: 30.0
  curvature_lookahead: 30

  # Cornering stiffness estimation window — tick-based, so 10 ticks at
  # dt=100 ms covers 1.0 s of physical time (vs 0.4 s at the dt=40 ms parent).
  # Drop to 4 if you want to keep the same physical window.
  calpha_window_size: 10

  # Action prior — Stanley dt=0.1 SVGP trained from collect_stanley_dt0.1_data.py
  action_prior_model_path: MCTS_SVGP_action_sampler/stanley_dt0.1_svgp_no_lateral
  # action_prior_model_path: MCTS_SVGP_action_sampler/minimal_feature_1st_train/
  action_prior_model_type: svgp
  uniform_action_sampling: false
  # Force every MCTS-sampled action to come from the GP action prior —
  # disables the budget-aware (agg / slow / feas) mixing. Set to debug
  # whether the slow driving was caused by the agg/slow/feas weighting.
  gp_action_only: true
  no_c_alpha_input: false

  # Krasser SVGP dynamics — Stanley dt=0.1, M=15 inducing points, trained
  # to predict 100 ms transitions.
  svgp_omega_model_path: MCTS_SVGP_dynaimcs_model/data/models/krasser_svgp_var_5_stanley_M_15.npz
  svgp_beta_model_path:  MCTS_SVGP_dynaimcs_model/data/models/krasser_svgp_var_6_stanley_M_15.npz
  # SVGP training timestep. With dt_s=0.1 and svgp_base_timestep=0.1 the
  # MCTS rollout calls the SVGP exactly ONCE per tick (n_substeps =
  # round(0.1/0.1) = 1) — matching the way these models were trained.
  svgp_base_timestep: 0.1

  use_occupancy_map: true

dynamics:
  type: f1tenth_dynamics

safety:
  type: noop

simulation:
  # MCTS plans every 100 ms; gym integrates at 20 ms. apply_action() holds the
  # MCTS-output command for round(0.1 / 0.02) = 5 sub-steps per control tick.
  # This decouples the dynamic-single-track Euler stability (fragile at 100 ms)
  # from the planning rate.
  dt_s: 0.1
  physics_dt_s: 0.02
  log_every_n_steps: 1
  seed: 42
  vehicle_interface: gym

  # SVGP state propagation: use extended kinematic model + GP corrections
  use_svgp_state: false
  svgp_state_omega_model_path: MCTS_SVGP_dynaimcs_model/data/models/krasser_svgp_var_5_stanley_M_15.npz
  svgp_state_beta_model_path:  MCTS_SVGP_dynaimcs_model/data/models/krasser_svgp_var_6_stanley_M_15.npz
