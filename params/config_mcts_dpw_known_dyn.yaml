# Algorithm Configuration: MCTS DPW controller + known F1TENTH dynamics
# Uses Monte Carlo Tree Search with Double Progressive Widening.

# This crashes a lot for low friction values that is 0.4947. Will need a HP search.

controller:
  type: mcts_dpw_py
  # --- MCTS DPW hyperparameters ---
  n_simulations: 500
  exploration_constant: 1.0    # K (UCB exploration)
  alpha_dpw: 0.5               # action progressive widening exponent
  beta_dpw: 0.5                # outcome progressive widening exponent
  discount: 0.99             # rollout discount factor
  rollout_horizon: 15          # matches MPPI horizon; no early termination now
  # --- Reward/cost tuning (shared with MPPI) ---
  v_ref: 10.0
  speed_weight: 100.0
  alpha_threshold: 1.0
  use_occupancy_map: true
  # lane_width: 2.2
  lane_width: 1.1

dynamics:
  type: f1tenth_dynamics   # Known dynamics (same math as gym) — for testing

safety:
  type: noop

simulation:
  vehicle_interface: gym
  dt_s: 0.04             # Timestep in seconds (controls loop rate: 1/dt_s Hz)
  log_every_n_steps: 1
  seed: 42               # Random seed for reproducibility
