# Algorithm Configuration: MPPI controller + known F1TENTH dynamics
# Uses the exact same single-track model as the gym simulator.

controller:
  type: mppi
  # --- MPPI-specific ---
  horizon: 15
  num_samples: 500
  lambda_: 1.0
  noise_sigma_accel: 2.0
  noise_sigma_steer: 1.0
  v_ref: 5.0
  device: cpu
  use_occupancy_map: true
  lane_width: 1.1
  curvature_lookahead: 30    # steps ahead for max_kappa (30 * 0.04s = 1.2s)
  # --- Cost function tuning ---
  v_max_cost: 11.15
  alpha_threshold: 3.5
  speed_weight: 5.0

dynamics:
  type: f1tenth_dynamics   # Known dynamics (same math as gym) — for testing

safety:
  type: noop

simulation:
  vehicle_interface: gym
  dt_s: 0.04             # Timestep in seconds (controls loop rate: 1/dt_s Hz)
  log_every_n_steps: 200
  seed: 42               # Random seed for reproducibility
