controller:
  type: mcts_svgp_cpp_budget_aware_chance_prob_pred

  # MCTS tree hyperparameters
  alpha_dpw: 0.5
  beta_dpw: 0.1
  exploration_constant: 1.0
  discount: 0.9
  n_simulations: 0             # 0 → use mcts_time_budget instead

  # Time budget
  mcts_time_budget: 0.030      # seconds per decision step (12 ms)
  dynamic_budget: false         # if true, sample budget from U(min, max) each step
  dynamic_budget_min: 0.005     # 5 ms lower bound
  dynamic_budget_max: 0.030     # 30 ms upper bound

  # Localization-aware budget: use remaining time after PF as MCTS budget
  localize_budget: false                # if true, MCTS budget = remaining_time - overhead
  localize_budget_overhead_s: 0.010     # 10 ms overhead for MCTS pre/post processing

  # Budget-aware warmup (equal weights for first N_warmup iterations)
  budget_n_warmup: 10
  budget_n_recalibrate: 10    # MLP recalibration every N iterations in Phase 3

  # Rollout horizons
  rollout_horizon: 12
  rollout_horizon_straight: 15
  rollout_horizon_curve: 15
  kappa_threshold: 0.05

  # Cost function
  speed_weight: 1.0
  v_ref: 1000.0
  alpha_threshold: 0.475
  normalize_reward: false

  # Track boundaries
  lane_width: 1.1
  real_track_width: 1.75

  # Lateral acceleration budget for v_ref window solver
  a_lat_budget: 30.0
  curvature_lookahead: 30

  # Cornering stiffness estimation window
  calpha_window_size: 10

  # Action prior (SVGP/SGPR)
  # MPPI-collected dataset (original):
  # action_prior_model_path: MCTS_SVGP_action_sampler/minimal_feature_1st_train/
  # Stanley-collected dt=0.02 dataset (3000 rows, no_lateral feature set
  # [S_vel, max_kappa, C_alpha], trained 2026-05-07. Best of 100 hp_search
  # trials with M<=130 cap; trial #97 M=64. Test RMSE accel=0.667 steer=0.949):
  action_prior_model_path: MCTS_SVGP_action_sampler/stanley_dt0.02_svgp_no_lateral/
  action_prior_model_type: svgp
  uniform_action_sampling: false  # if true, use uniform sampling instead of action prior
  no_c_alpha_input: false         # if true, SVGP dynamics uses 6D input (no C_alpha)

  # Krasser SVGP dynamics models
  # MPPI-collected dt=0.02 dataset (original):
  # svgp_omega_model_path: models/svgp/krasser_svgp_omega_YasMarina_VAR5_jax_Ts0.020_MPPI_data_ard_kernel_c_alpha_smooth_M_11.npz
  # svgp_beta_model_path: models/svgp/krasser_svgp_beta_YasMarina_VAR6_jax_Ts0.020_MPPI_data_ard_kernel_c_alpha_smooth_M_12.npz
  # Stanley-collected dt=0.02 dataset (3000 rows, trained 2026-05-07, M=15 ARD + c_alpha_smooth;
  # test RMSE orig: omega 0.0071, beta 0.00077):
  svgp_omega_model_path: MCTS_SVGP_dynaimcs_model/data/models/krasser_svgp_omega_YasMarina_VAR5_jax_Ts0.020_stanley_dt002_data_ard_kernel_c_alpha_smooth_M_15.npz
  svgp_beta_model_path: MCTS_SVGP_dynaimcs_model/data/models/krasser_svgp_beta_YasMarina_VAR6_jax_Ts0.020_stanley_dt002_data_ard_kernel_c_alpha_smooth_M_15.npz

  use_occupancy_map: true

dynamics:
  type: f1tenth_dynamics

safety:
  type: noop

simulation:
  dt_s: 0.04
  log_every_n_steps: 1
  seed: 42
  vehicle_interface: gym
  # SVGP state propagation: use extended kinematic model + GP corrections
  use_svgp_state: false
  svgp_state_omega_model_path: models/svgp/krasser_svgp_omega_YasMarina_VAR5_jax_Ts0.020_MPPI_data_ard_kernel_c_alpha_smooth_M_11.npz
  svgp_state_beta_model_path: models/svgp/krasser_svgp_beta_YasMarina_VAR6_jax_Ts0.020_MPPI_data_ard_kernel_c_alpha_smooth_M_12.npz
