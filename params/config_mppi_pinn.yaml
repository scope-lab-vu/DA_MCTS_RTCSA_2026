# Algorithm Configuration: MPPI controller + PINN dynamics model
# Uses a pretrained DeepPacejka PINN for omega/beta prediction.
# Hyperparameters tuned from reference PINN-MPPI experiments.

controller:
  type: mppi
  # --- MPPI-specific ---
  horizon: 15
  num_samples: 5000
  lambda_: 2.93
  noise_sigma_accel: 2.29
  noise_sigma_steer: 3.98
  v_ref: 5.0
  device: cpu
  use_occupancy_map: true
  lane_width: 1.1
  # --- Cost function tuning ---
  v_max_cost: 8.0
  alpha_threshold: 0.5
  speed_weight: 5.0

dynamics:
  type: pinn
  model_path: models/pinn/weights/epoch_388.pth
  model_cfg_path: models/pinn/deep_pacejka_f1tenth_multi_fric_best_param.yaml
  scaler_path: models/pinn/weights/scaler_safe.npz
  inference_device: cpu

safety:
  type: noop

simulation:
  vehicle_interface: gym
  dt_s: 0.04              # Must be 0.02 to match PINN training timestep
  log_every_n_steps: 1
  seed: 42
