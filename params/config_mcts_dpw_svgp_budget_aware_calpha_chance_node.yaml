# Algorithm Configuration: MCTS DPW C++ + Krasser SVGP dynamics (Ekin + C_alpha residuals)
#                         + SVGP action prior + GP variance sampling at chance nodes
#                         + Budget-aware action weighting (3-phase learn_timed)
#
# Dynamics: Extended Kinematic + Krasser SVGP residual corrections for omega & beta
#           Uses ARD RBF kernel with 7D input: [delta, v, omega, beta, accl, sv, C_alpha]
# Chance nodes: GP posterior variance cached on first expansion; subsequent expansions
#               sample omega & beta from N(mean, variance) without recomputing the GP.
# Budget-aware: Warmup phase (equal weights) → estimate N_total → adapt action weights
#               tight (tau=0): p_agg=0.05  p_slow=0.90  p_feas=0.05
#               ample (tau=1): p_agg=0.37  p_slow=0.01  p_feas=0.62
# Cost: Dual boundaries (imaginary soft + real hard), backward check, curvature solver

controller:
  type: mcts_dpw_svgp_cpp_budget_aware_mcts_chance_node
  # --- MCTS DPW hyperparameters ---
  n_simulations: 0
  exploration_constant: 1.0   # K (UCB exploration)
  alpha_dpw: 0.5               # action progressive widening exponent
  beta_dpw: 0.1              # outcome progressive widening exponent
  discount: 0.9                # rollout discount factor
  rollout_horizon: 12          # initial/fallback horizon
  rollout_horizon_straight: 15  # horizon on straight segments (low kappa)
  rollout_horizon_curve: 15    # horizon approaching curves (high kappa)
  kappa_threshold: 0.05        # max_kappa < threshold → straight
  # --- Budget-aware action weighting ---
  budget_w_low: 15.0           # W_hat below this → tight budget (tau=0)
  budget_w_high: 50.0          # W_hat above this → ample budget (tau=1)
  budget_n_warmup: 10         # iterations in Phase 1 (equal weights)
  budget_n_recalibrate: 10    # recalibrate every N iterations in Phase 3
  # --- Reward/cost tuning ---
  v_ref: 1000.0
  speed_weight: 1.0
  # alpha_threshold: 1.5
  alpha_threshold: 0.4 # Got this value from the lateral tire force experiment: it's where the Fy vs alpha curve deviates. 
  a_lat_budget: 30.0
  curvature_lookahead: 30
  mcts_time_budget: 0.035
  use_occupancy_map: true
  lane_width: 1.1
  real_track_width: 1.75
  normalize_reward: false
  # --- Action prior ---
  action_prior_model_type: svgp   # "svgp" or "sgpr_krasserm"
  action_prior_model_path: MCTS_SVGP_action_sampler/minimal_feature_1st_train/
  calpha_window_size: 10
  # --- Krasser SVGP dynamics models (Ekin + ARD RBF residuals, C_alpha_smooth as 7th input) ---
  svgp_omega_model_path: models/svgp/krasser_svgp_omega_YasMarina_VAR5_jax_Ts0.020_MPPI_data_ard_kernel_c_alpha_smooth_M_11.npz
  svgp_beta_model_path: models/svgp/krasser_svgp_beta_YasMarina_VAR6_jax_Ts0.020_MPPI_data_ard_kernel_c_alpha_smooth_M_12.npz

dynamics:
  type: f1tenth_dynamics

safety:
  type: noop

simulation:
  vehicle_interface: gym
  dt_s: 0.04
  log_every_n_steps: 1
  seed: 42
