# Algorithm Configuration: MCTS DPW C++ controller + PI-SVGP (Pacejka) dynamics
# Uses a multi-output GP to predict 9 Pacejka tire parameters,
# then applies Pacejka physics for dynamics rollouts, all in C++.

controller:
  type: mcts_pi_svgp_cpp
  # --- MCTS DPW hyperparameters ---
  n_simulations: 1000
  exploration_constant: 0.7    # K (UCB exploration)
  alpha_dpw: 0.5               # action progressive widening exponent
  beta_dpw: 0.5                # outcome progressive widening exponent
  discount: 0.9               # rollout discount factor
  rollout_horizon: 15
  # --- Reward/cost tuning ---
  v_ref: 1000000.0
  speed_weight: 30.0
  alpha_threshold: 1.2
  use_occupancy_map: true
  lane_width: 1.1
  # --- PI-SVGP model path (relative to project root) ---
  # pi_svgp_model_path: models/pi_svgp_mcts_data/mcts_svgp_best_params.npz
  pi_svgp_model_path: models/pi_svgp_mcts_fixed/mcts_svgp_fixed.npz
  svgp_task_index: 0           # 0=mu1.0489, 1=mu0.8642, 2=mu0.4947

dynamics:
  type: f1tenth_dynamics   # Not used by the controller (PI-SVGP is internal), but needed by the factory

safety:
  type: noop

simulation:
  vehicle_interface: gym
  dt_s: 0.04         # Timestep: 25 Hz (→ 2 PI-SVGP substeps of 0.02s each)
  log_every_n_steps: 1
  seed: 42
